[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ur10e-dp-real"
version = "0.1.0"
description = "UR10e keyboard demonstrations and pretrained Lift Diffusion Policy adaptation"
requires-python = ">=3.8"
dependencies = ["numpy<2", "scipy>=1.7", "Pillow>=9.1"]

[project.optional-dependencies]
hardware = ["ur-rtde>=1.5,<2", "pyrealsense2>=2.50", "pygame>=2.1"]
train = ["torch>=2.0,<2.6", "torchvision>=0.15,<0.21", "diffusers==0.11.1", "huggingface-hub<0.26", "hydra-core==1.3.2", "dill>=0.3", "einops>=0.4", "robomimic==0.2.0", "h5py>=3", "zarr<3", "numba", "imageio", "imageio-ffmpeg", "tensorboard", "termcolor", "tqdm"]
test = ["pytest>=7"]

[project.scripts]
ur-dp = "ur10e_dp_real.cli:main"

[tool.setuptools.packages.find]
include = ["ur10e_dp_real*", "diffusion_policy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
